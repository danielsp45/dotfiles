[Settings]
language = en
folder = ~/.dotfiles/home/programs/hyprland/wallpapers
monitors = All
wallpaper = ~/.dotfiles/home/programs/hyprland/wallpapers/carina-nebula.png
show_path_in_tooltip = True
backend = swaybg
fill = fill
sort = name
color = #ffffff
subfolders = False
all_subfolders = False
show_hidden = False
show_gifs_only = False
post_command = ln -sf $(grep '^wallpaper' ~/.dotfiles/home/programs/hyprland/waypaper/config.ini | cut -d= -f2 | xargs | sed "s|~|$HOME|") ~/.wallpaper
number_of_columns = 3
swww_transition_type = any
swww_transition_step = 90
swww_transition_angle = 0
swww_transition_duration = 2
swww_transition_fps = 60
mpvpaper_sound = False
mpvpaper_options = 
use_xdg_state = False
zen_mode = False
stylesheet = /home/daniel/.config/waypaper/style.css
keybindings = ~/.config/waypaper/keybindings.ini

