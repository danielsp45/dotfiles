# hypridle: lock, screen off and (on laptops) suspend after inactivity.
# Apps that hold an idle inhibitor (a playing video, a call) pause the timers.
# See https://wiki.hypr.land/Hypr-Ecosystem/hypridle/

general {
    lock_cmd = ~/.local/share/config/bin/lock-screen
    before_sleep_cmd = loginctl lock-session   # lock before suspend
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 5 min: lock the screen
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# 5.5 min: turn the screen off; any input turns it back on
listener {
    timeout = 330
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "off" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "on" })'
}

# 10 min: suspend, only on machines with a battery (laptops)
listener {
    timeout = 600
    on-timeout = test -d /sys/class/power_supply/BAT0 && systemctl suspend
}
